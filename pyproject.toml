[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatio-textual"
version = "0.3.0"
description = "Spatial textual annotation, testimony segmentation, affect analysis, entity linking, telemetry and visualisation for digital humanities."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ignatius Ezeani", email = "i.ezeani@lancaster.ac.uk" }]
license = { text = "MIT" }
keywords = ["nlp", "digital humanities", "spatial humanities", "annotation", "testimonies", "geography"]
dependencies = [
  "spacy>=3.6,<4.0",
  "pandas>=2.0",
  "geonamescache>=2.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "folium>=0.15"]
dev = ["pytest>=8", "tqdm>=4.66"]
transformers = ["transformers>=4.44", "torch>=2.1"]
llm = ["openai>=1.0.0", "anthropic>=0.40", "google-genai>=1.0.0", "mistralai>=1.0.0", "httpx>=0.27"]
all = [
  "streamlit>=1.36", "folium>=0.15", "pytest>=8", "tqdm>=4.66",
  "transformers>=4.44", "torch>=2.1",
  "openai>=1.0.0", "anthropic>=0.40", "google-genai>=1.0.0", "mistralai>=1.0.0", "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/SpaceTimeNarratives/spatio-textual"
Issues = "https://github.com/SpaceTimeNarratives/spatio-textual/issues"

[project.scripts]
spatio-textual = "spatio_textual.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["spatio_textual*"]

[tool.setuptools.package-data]
spatio_textual = ["resources/*.txt"]
